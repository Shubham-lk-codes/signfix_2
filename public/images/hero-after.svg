<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="afterBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071a2d"/>
      <stop offset="100%" stop-color="#0b2c4d"/>
    </linearGradient>

    <filter id="glowAmber" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur1"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffc133"/>
      <stop offset="100%" stop-color="#ff9900"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#afterBg)"/>
  
  <!-- Sleek Dark Metallic Panel -->
  <rect x="100" y="140" width="600" height="320" rx="12" fill="#091826" stroke="#ffb000" stroke-width="3" filter="url(#glowAmber)"/>
  
  <!-- Brushed Metal Texture Lines -->
  <line x1="120" y1="140" x2="680" y2="460" stroke="rgba(255,255,255,0.04)" stroke-width="2"/>
  <line x1="200" y1="140" x2="680" y2="380" stroke="rgba(255,255,255,0.03)" stroke-width="2"/>

  <!-- 3D Backlit Glow Behind Letters -->
  <ellipse cx="400" cy="300" rx="250" ry="80" fill="#ffb000" opacity="0.3" filter="url(#glowAmber)"/>
  
  <!-- 3D Restored Channel Letters -->
  <g filter="url(#glowAmber)">
    <!-- 3D Depth Shadow -->
    <text x="404" y="324" text-anchor="middle" font-family="'Bricolage Grotesque', sans-serif" font-weight="900" font-size="84" letter-spacing="8" fill="#a86e00">SIGNFIX</text>
    <!-- Front Face -->
    <text x="400" y="320" text-anchor="middle" font-family="'Bricolage Grotesque', sans-serif" font-weight="900" font-size="84" letter-spacing="8" fill="url(#goldText)">SIGNFIX</text>
  </g>

  <!-- Clean Sub-text -->
  <text x="400" y="375" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="16" fill="#00d2ff" letter-spacing="4">RESTORED &amp; ILLUMINATED</text>

  <!-- Success Badge -->
  <rect x="130" y="465" width="220" height="32" rx="4" fill="#059669"/>
  <text x="240" y="486" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="13" fill="#ffffff" letter-spacing="1">AFTER: 100% RESTORED</text>
</svg>
