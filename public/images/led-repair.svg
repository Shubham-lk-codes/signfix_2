<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="ledRepairBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071726"/>
      <stop offset="100%" stop-color="#0d253a"/>
    </linearGradient>
    <filter id="repairGlow">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#ledRepairBg)"/>

  <!-- Building Wall Grid -->
  <g opacity="0.12" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
  </g>

  <!-- Large Illuminated Storefront Sign Board -->
  <rect x="200" y="140" width="800" height="380" rx="16" fill="#091c2e" stroke="#ffb000" stroke-width="4" filter="url(#repairGlow)"/>

  <!-- Left Side: Working Bright LED Section -->
  <g filter="url(#repairGlow)">
    <text x="360" y="360" text-anchor="middle" font-family="'Bricolage Grotesque', sans-serif" font-weight="900" font-size="110" fill="#ffb000">HYD</text>
  </g>

  <!-- Right Side: Dark Broken LED Section Being Repaired -->
  <g opacity="0.25">
    <text x="740" y="360" text-anchor="middle" font-family="'Bricolage Grotesque', sans-serif" font-weight="900" font-size="110" fill="#64748b">LED</text>
  </g>

  <!-- Opened Repair Hatch on "LED" Section -->
  <rect x="620" y="240" width="240" height="180" rx="8" fill="#0f172a" stroke="#00d2ff" stroke-width="3"/>
  <circle cx="740" cy="330" r="40" fill="#00d2ff" opacity="0.15" filter="url(#repairGlow)"/>
  
  <!-- Technician Diagnostic Spark / Repair Light -->
  <line x1="700" y1="310" x2="780" y2="350" stroke="#00d2ff" stroke-width="4" filter="url(#repairGlow)"/>
  <circle cx="740" cy="330" r="10" fill="#ffffff" filter="url(#repairGlow)"/>

  <!-- Warning & Status Indicators -->
  <g transform="translate(640, 260)">
    <rect width="90" height="24" rx="4" fill="#ef4444"/>
    <text x="45" y="16" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="10" fill="#ffffff">FAULT FOUND</text>
  </g>

  <g transform="translate(740, 260)">
    <rect width="100" height="24" rx="4" fill="#10b981"/>
    <text x="50" y="16" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="10" fill="#ffffff">DIAGNOSED</text>
  </g>

  <!-- Floating Badge -->
  <rect x="240" y="180" width="280" height="36" rx="18" fill="#ffb000"/>
  <text x="380" y="203" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="13" fill="#071a2d" letter-spacing="1">ON-SITE LED REPAIR &amp; DIAGNOSTICS</text>
</svg>
