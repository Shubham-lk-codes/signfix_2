<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="w2Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141c2b"/>
      <stop offset="100%" stop-color="#0b1320"/>
    </linearGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#w2Bg)"/>
  
  <!-- Split Showcase: Left Before vs Right After -->
  <!-- Left Side: Weathered Old Sign -->
  <rect x="80" y="100" width="300" height="280" rx="8" fill="#1c1917" stroke="#44403c" stroke-width="2"/>
  <text x="230" y="240" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="32" fill="#78716c">OLD FASCIA</text>
  <rect x="100" y="120" width="90" height="24" rx="4" fill="#dc2626"/>
  <text x="145" y="136" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="11" fill="#ffffff">BEFORE</text>

  <!-- Right Side: Beautiful Restored 3D Neon Sign -->
  <rect x="420" y="100" width="300" height="280" rx="8" fill="#030712" stroke="#10b981" stroke-width="3" filter="url(#glow2)"/>
  <text x="570" y="240" text-anchor="middle" font-family="'Bricolage Grotesque', sans-serif" font-weight="900" font-size="36" fill="#10b981" filter="url(#glow2)">RESTORED</text>
  <rect x="440" y="120" width="90" height="24" rx="4" fill="#10b981"/>
  <text x="485" y="136" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="11" fill="#ffffff">AFTER</text>

  <!-- Category Tag -->
  <rect x="80" y="410" width="220" height="28" rx="14" fill="#10b981"/>
  <text x="190" y="429" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="12" fill="#ffffff">RESTORATION CASE STUDY</text>
</svg>
