<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="w3Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#1c2541"/>
    </linearGradient>
    <filter id="glow3">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#w3Bg)"/>

  <!-- Corporate Building Grid -->
  <g opacity="0.2">
    <rect x="100" y="80" width="180" height="320" fill="#3a5a40"/>
    <rect x="310" y="80" width="180" height="320" fill="#3a5a40"/>
    <rect x="520" y="80" width="180" height="320" fill="#3a5a40"/>
  </g>

  <!-- Standardized 3D Storefront Signs across Multi Outlets -->
  <rect x="120" y="140" width="140" height="60" rx="6" fill="#071a2d" stroke="#ffb000" stroke-width="2" filter="url(#glow3)"/>
  <text x="190" y="176" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="16" fill="#ffb000">OUTLET 1</text>

  <rect x="330" y="140" width="140" height="60" rx="6" fill="#071a2d" stroke="#ffb000" stroke-width="2" filter="url(#glow3)"/>
  <text x="400" y="176" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="16" fill="#ffb000">OUTLET 2</text>

  <rect x="540" y="140" width="140" height="60" rx="6" fill="#071a2d" stroke="#ffb000" stroke-width="2" filter="url(#glow3)"/>
  <text x="610" y="176" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="16" fill="#ffb000">OUTLET 3</text>

  <!-- Category Tag -->
  <rect x="100" y="420" width="240" height="28" rx="14" fill="#8b5cf6"/>
  <text x="220" y="439" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="12" fill="#ffffff">PAN-INDIA ROLLOUT CASE STUDY</text>
</svg>
